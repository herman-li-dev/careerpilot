spring:
  application:
    name: careerpilot
  profiles:
    active: local
  datasource:
    # Local development uses host port 5433 so this checkout never attaches to another
    # workspace's "careerpilot-postgres" container that publishes 5432. Override with CAREERPILOT_DB_URL.
    url: ${CAREERPILOT_DB_URL:jdbc:postgresql://localhost:5433/careerpilot}
    username: ${CAREERPILOT_DB_USERNAME:careerpilot_app}
    password: ${CAREERPILOT_DB_PASSWORD:}
  flyway:
    # Keep default tests database-independent; enable migrations explicitly when a database is required.
    enabled: ${CAREERPILOT_DB_MIGRATION_ENABLED:false}
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 5242880B
      max-request-size: 6291456B
  mvc:
    # Even debug logging must not print multipart fields, Bearer tokens, or document content.
    log-request-details: false
  ai:
    dashscope:
      # Read provider credentials only from the environment.
      api-key: ${DASHSCOPE_API_KEY:}
      chat:
        enabled: ${careerpilot.ai.enabled}
        options:
          model: qwen-plus
      embedding:
        # RAG is opt-in; the AI environment post-processor also excludes this auto-configuration
        # whenever careerpilot.ai.enabled is false.
        enabled: ${careerpilot.review.rag.enabled}
        options:
          model: text-embedding-v3
          dimensions: 1024
      image:
        enabled: false
server:
  port: 8123
  servlet:
    context-path: /api
# Model request and response bodies must not be logged.
logging:
  level:
    org.springframework.ai: INFO

careerpilot:
  public-rag:
    auth:
      # The application-level switch also enables the shared Clerk JWT verifier.
      enabled: ${CAREERPILOT_CLERK_AUTH_ENABLED:${CAREERPILOT_PUBLIC_RAG_AUTH_ENABLED:false}}
      issuer: ${CAREERPILOT_CLERK_ISSUER:}
      authorized-parties: ${CAREERPILOT_CLERK_AUTHORIZED_PARTIES:}
    upload:
      # Validates and extracts one request-scoped Resume without persistence or model calls.
      enabled: ${CAREERPILOT_PUBLIC_RAG_UPLOAD_ENABLED:false}
    guard:
      # Reserved for the future live public RAG call boundary; uploads do not consume model quota.
      enabled: ${CAREERPILOT_PUBLIC_RAG_GUARD_ENABLED:false}
      daily-user-request-limit: ${CAREERPILOT_PUBLIC_RAG_DAILY_USER_LIMIT:3}
      daily-global-request-limit: ${CAREERPILOT_PUBLIC_RAG_DAILY_GLOBAL_LIMIT:100}
      max-concurrent-requests: ${CAREERPILOT_PUBLIC_RAG_MAX_CONCURRENT_REQUESTS:2}
      max-input-tokens: ${CAREERPILOT_PUBLIC_RAG_MAX_INPUT_TOKENS:6000}
      max-output-tokens: ${CAREERPILOT_PUBLIC_RAG_MAX_OUTPUT_TOKENS:800}
      max-total-tokens: ${CAREERPILOT_PUBLIC_RAG_MAX_TOTAL_TOKENS:6800}
      identity-hmac-secret: ${CAREERPILOT_PUBLIC_RAG_GUARD_HMAC_SECRET:}
  demo:
    # Public synthetic-data demo mode is opt-in and must remain disabled for normal local use.
    enabled: ${CAREERPILOT_DEMO_ENABLED:false}
  ai:
    # Local startup is AI-optional. Explicitly opt in before using model-backed features.
    enabled: ${CAREERPILOT_AI_ENABLED:false}
  review:
    rag:
      # Public synthetic knowledge is the only source permitted in the first RAG slice.
      enabled: ${CAREERPILOT_RAG_ENABLED:false}
      top-k: 8
      similarity-threshold: ${CAREERPILOT_RAG_SIMILARITY_THRESHOLD:0.50}
      max-context-chars: 6000
      allowed-source-ids:
        - careerpilot-synthetic-resume-review-v1
      index-version: synthetic-review-rag-v1
  cors:
    allowed-origins: ${CAREERPILOT_CORS_ALLOWED_ORIGINS:http://localhost:3000}
  auth:
    # When enabled, Clerk Bearer JWTs replace the legacy session cookie on all personal APIs.
    clerk-application-enabled: ${CAREERPILOT_CLERK_AUTH_ENABLED:false}
    jwt-secret: ${CAREERPILOT_JWT_SECRET:}
    session-duration: ${CAREERPILOT_AUTH_SESSION_DURATION:PT8H}
    cookie-secure: ${CAREERPILOT_AUTH_COOKIE_SECURE:false}
