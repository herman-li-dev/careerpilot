map $http_x_forwarded_proto $careerpilot_forwarded_proto {
    default $scheme;
    http http;
    https https;
}

upstream careerpilot_backend {
    server backend:8123;
    keepalive 16;
}

server {
    listen 80;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 6m;

    error_page 403 = @demo_read_only;

    location @demo_read_only {
        default_type application/json;
        return 403 '{"success":false,"data":null,"error":{"code":"DEMO_READ_ONLY","message":"This public demo is read-only."}}';
    }

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /api/auth/demo-login {
        include /etc/nginx/proxy_params;
        proxy_pass http://careerpilot_backend;
    }

    location = /api/auth/logout {
        include /etc/nginx/proxy_params;
        proxy_pass http://careerpilot_backend;
    }

    location ~ ^/api/resumes/[0-9]+/review$ {
        include /etc/nginx/proxy_params;
        proxy_pass http://careerpilot_backend;
    }

    location ~ ^/api/analyses/[0-9]+/interview-prep$ {
        include /etc/nginx/proxy_params;
        proxy_pass http://careerpilot_backend;
    }

    location /api/ {
        limit_except GET {
            deny all;
        }
        include /etc/nginx/proxy_params;
        proxy_pass http://careerpilot_backend;
    }

    location ~* \.(?:css|js|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|eot)$ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
