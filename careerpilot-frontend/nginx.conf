map $http_x_forwarded_proto $careerpilot_forwarded_proto {
    default $scheme;
    http http;
    https https;
}

# The outer TLS proxy must overwrite X-Real-IP. The container port is bound to host loopback,
# so untrusted Internet clients cannot reach this Nginx layer directly.
map $http_x_real_ip $careerpilot_public_rag_ip_key {
    default $binary_remote_addr;
    "~^(?:(?:25[0-5]|2[0-4]\d|1?\d?\d)\.){3}(?:25[0-5]|2[0-4]\d|1?\d?\d)$" $http_x_real_ip;
    "~^(?=.{2,39}$)(?:[0-9A-Fa-f]{0,4}:){2,7}[0-9A-Fa-f]{0,4}$" $http_x_real_ip;
}

limit_req_zone $careerpilot_public_rag_ip_key zone=public_rag_per_ip:10m rate=2r/m;

upstream careerpilot_backend {
    server backend:8123;
    keepalive 16;
}

server {
    listen 80;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 6m;

    error_page 403 = @demo_read_only;
    error_page 429 = @public_rag_rate_limited;

    location @demo_read_only {
        default_type application/json;
        return 403 '{"success":false,"data":null,"error":{"code":"DEMO_READ_ONLY","message":"This public demo is read-only."}}';
    }

    location @public_rag_rate_limited {
        default_type application/json;
        return 429 '{"success":false,"data":null,"error":{"code":"PUBLIC_RAG_IP_RATE_LIMITED","message":"Too many public Resume Review requests. Please try again later."}}';
    }

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self' ${CAREERPILOT_CLERK_ISSUER} https://*.protect.clerk.com:*; img-src 'self' data: https://img.clerk.com; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; script-src 'self' ${CAREERPILOT_CLERK_ISSUER} https://challenges.cloudflare.com https://*.protect.clerk.com; frame-src 'self' https://challenges.cloudflare.com https://*.protect.clerk.com; font-src 'self'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /api/auth/demo-login {
        include /etc/nginx/proxy_params;
        proxy_pass http://careerpilot_backend;
    }

    location = /api/auth/logout {
        include /etc/nginx/proxy_params;
        proxy_pass http://careerpilot_backend;
    }

    location ~ ^/api/resumes/[0-9]+/review$ {
        include /etc/nginx/proxy_params;
        proxy_pass http://careerpilot_backend;
    }

    location ~ ^/api/analyses/[0-9]+/interview-prep$ {
        include /etc/nginx/proxy_params;
        proxy_pass http://careerpilot_backend;
    }

    location = /api/rag/resume/validate {
        limit_req zone=public_rag_per_ip burst=1 nodelay;
        limit_req_status 429;
        client_body_timeout 10s;
        include /etc/nginx/proxy_public_rag_params;
        proxy_pass http://careerpilot_backend;
    }

    # Live review shares the bounded public-RAG IP bucket with upload validation.
    location = /api/rag/resume/review {
        limit_req zone=public_rag_per_ip burst=1 nodelay;
        limit_req_status 429;
        client_body_timeout 10s;
        include /etc/nginx/proxy_public_rag_params;
        proxy_pass http://careerpilot_backend;
    }

    location /api/ {
        limit_except GET {
            deny all;
        }
        include /etc/nginx/proxy_params;
        proxy_pass http://careerpilot_backend;
    }

    location ~* \.(?:css|js|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|eot)$ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
