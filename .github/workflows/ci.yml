name: CareerPilot CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Run backend tests
        run: |
          chmod +x mvnw
          ./mvnw -B test

  public-rag-guard-database:
    name: Public RAG guard database tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg16-bookworm
        env:
          POSTGRES_DB: careerpilot_guard_test
          POSTGRES_USER: careerpilot_guard_test
          POSTGRES_PASSWORD: synthetic-test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U careerpilot_guard_test -d careerpilot_guard_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Run migrations and public RAG database tests
        env:
          CAREERPILOT_DB_URL: jdbc:postgresql://localhost:5432/careerpilot_guard_test
          CAREERPILOT_DB_USERNAME: careerpilot_guard_test
          CAREERPILOT_DB_PASSWORD: synthetic-test-password
        run: |
          chmod +x mvnw
          ./mvnw -B -Pexternal-tests -Dtest=PublicRagQuotaIntegrationTest,ResumeReviewVectorSchemaMigrationTest test

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: careerpilot-frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: careerpilot-frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build normal application
        run: npm run build
      - name: Build read-only demo
        env:
          VITE_CAREERPILOT_DEMO_MODE: "true"
        run: npm run build
      - name: Build optional public upload slice
        env:
          VITE_CAREERPILOT_DEMO_MODE: "true"
          VITE_CAREERPILOT_PUBLIC_RAG_AUTH_ENABLED: "true"
          VITE_CAREERPILOT_PUBLIC_RAG_UPLOAD_ENABLED: "true"
          VITE_CLERK_PUBLISHABLE_KEY: "pk_test_ci-placeholder"
        run: npm run build
      - name: Build application-level Clerk workspace
        env:
          VITE_CAREERPILOT_AUTH_ENABLED: "true"
          VITE_CLERK_PUBLISHABLE_KEY: "pk_test_ci-placeholder"
        run: npm run build
