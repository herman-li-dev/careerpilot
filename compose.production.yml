name: careerpilot-demo

services:
  database:
    image: postgres:16.15-alpine
    platform: linux/amd64
    restart: unless-stopped
    mem_limit: 320m
    command: ["postgres", "-c", "shared_buffers=64MB", "-c", "max_connections=20"]
    environment:
      POSTGRES_DB: ${CAREERPILOT_DB_NAME:-careerpilot}
      POSTGRES_USER: ${CAREERPILOT_DB_USER:-careerpilot}
      POSTGRES_PASSWORD: ${CAREERPILOT_DB_PASSWORD:?Set CAREERPILOT_DB_PASSWORD}
    volumes:
      - careerpilot_demo_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - internal

  backend:
    image: careerpilot-demo-backend:latest
    platform: linux/amd64
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    mem_limit: 640m
    environment:
      JAVA_TOOL_OPTIONS: "-XX:InitialRAMPercentage=10 -XX:MaxRAMPercentage=50 -XX:MaxMetaspaceSize=160m -XX:+ExitOnOutOfMemoryError"
      SPRING_PROFILES_ACTIVE: prod
      CAREERPILOT_DB_URL: jdbc:postgresql://database:5432/${CAREERPILOT_DB_NAME:-careerpilot}
      CAREERPILOT_DB_USERNAME: ${CAREERPILOT_DB_USER:-careerpilot}
      CAREERPILOT_DB_PASSWORD: ${CAREERPILOT_DB_PASSWORD:?Set CAREERPILOT_DB_PASSWORD}
      CAREERPILOT_DB_MIGRATION_ENABLED: "true"
      CAREERPILOT_AI_ENABLED: "false"
      CAREERPILOT_DEMO_ENABLED: "true"
      CAREERPILOT_JWT_SECRET: ${CAREERPILOT_JWT_SECRET:?Set CAREERPILOT_JWT_SECRET}
      CAREERPILOT_AUTH_COOKIE_SECURE: ${CAREERPILOT_AUTH_COOKIE_SECURE:-true}
      CAREERPILOT_CORS_ALLOWED_ORIGINS: ${CAREERPILOT_PUBLIC_ORIGIN:?Set CAREERPILOT_PUBLIC_ORIGIN}
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://localhost:8123/api/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - internal

  frontend:
    image: careerpilot-demo-frontend:latest
    platform: linux/amd64
    build:
      context: ./careerpilot-frontend
      dockerfile: Dockerfile
      args:
        VITE_CAREERPILOT_DEMO_MODE: "true"
    restart: unless-stopped
    mem_limit: 96m
    ports:
      - "127.0.0.1:${CAREERPILOT_HTTP_PORT:-18080}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1/"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - internal

networks:
  internal:

volumes:
  careerpilot_demo_postgres:
